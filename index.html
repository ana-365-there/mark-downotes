<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>markdown-notes</title>
</head>

<body>
  <h1>Markdown Notes</h1>
  <main id="workspace">
    <textarea id="editor" placeholder="Start typing markdown..."></textarea>
    <div id="preview"></div>
  </main>
  <div id="buttons">
    <button id="save">Save</button>
    <button id="download-md">Download .md</button>
    <button id="download-html">Download .html</button>
    <button id="clear">Clear Storage</button>
  </div>
  <details id="tips">
    <summary>Markdown tips</summary>
    <ul>
      <li><code># Heading</code> for headings</li>
      <li><code>**bold**</code> for bold text</li>
      <li><code>- item</code> or <code>1. item</code> for lists</li>
    </ul>
    <p>
      New to markdown? See the
      <a href="https://www.markdownguide.org/basic-syntax/" target="_blank" rel="noopener noreferrer">
        Markdown Guide
      </a>.
    </p>
  </details>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
